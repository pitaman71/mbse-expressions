[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-expressions"
version = "0.2.0"
description = "Rules, predicates and constraints as language-neutral data: validated, evaluated, stored as JSON/YAML, and translated to and from Python, MATLAB and Excel"
keywords = ["expressions", "rules", "constraints", "predicates", "mbse", "sysml", "interface", "translation", "excel", "matlab"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mbse-schemas>=0.3.0,<0.4"]

[project.optional-dependencies]
yaml = ["mbse-schemas[yaml]>=0.3.0,<0.4"]
numpy = ["numpy>=2.4.6"]

[tool.setuptools.package-data]
"mbse.Expressions" = ["skill/*.md", "skill/references/*.md"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6",
]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkout: scripts/siblings.py

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Expressions"]
omit = ["*/mbse/Expressions/Conformance/*"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
