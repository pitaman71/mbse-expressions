[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-expressions"
version = "0.0.1"
description = "Serializable expressions and their evaluation, for mbse-schemas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mbse-schemas"]

[project.optional-dependencies]
yaml = ["mbse-schemas[yaml]"]

[tool.setuptools.packages.find]
include = ["mbse_expressions*"]
namespaces = true

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6",
]

[tool.uv.sources]
mbse-schemas = { path = "../submodules/mbse-schemas/python3", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse_expressions"]
omit = ["*/mbse_expressions/Conformance/*"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
