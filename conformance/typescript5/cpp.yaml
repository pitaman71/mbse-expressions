cpp:
  initializerlist:
    items:
    - conditionalexpression:
        condition:
          binaryexpression:
            left:
              unaryexpression:
                operator: '!'
                operand:
                  memberexpression:
                    object:
                      idexpression:
                        name:
                          identifier:
                            spelling: record
                    operator: '.'
                    member:
                      identifier:
                        spelling: a
            operator: '&&'
            right:
              binaryexpression:
                left:
                  subscriptexpression:
                    object:
                      memberexpression:
                        object:
                          idexpression:
                            name:
                              identifier:
                                spelling: record
                        operator: '->'
                        member:
                          identifier:
                            spelling: b
                    indices:
                    - literal:
                        value:
                          int: 0
                operator: '>'
                right:
                  literal:
                    value:
                      float: 1.5
                    suffix: f
        consequence:
          castexpression:
            type:
              typeid:
                specifiers:
                - namedtypespecifier:
                    name:
                      identifier:
                        spelling: uint8_t
            operand:
              callexpression:
                function:
                  idexpression:
                    name:
                      identifier:
                        spelling: record
                arguments:
                - literal:
                    value:
                      int: 1
        alternative:
          literal:
            value:
              int: 5
            suffix: u
    - constant:
        singleton: nullptr
    - userdefinedliteral:
        literal:
          value:
            int: 10
        suffix: _km
    - concatenatedstring:
        parts:
        - literal:
            value:
              str: a
        - literal:
            value:
              str: b
            raw: true
    - idexpression:
        name:
          qualifiedname:
            qualifiers:
            - identifier:
                spelling: std
            name:
              identifier:
                spelling: cout
    - thisexpression: {}
    - parenthesizedexpression:
        expression:
          idexpression:
            name:
              identifier:
                spelling: record
    - lambdaexpression:
        captures:
        - defaultcapture:
            mode: '='
        - simplecapture:
            by_reference: true
            name:
              spelling: record
        - initcapture:
            name:
              identifier:
                spelling: 'n'
            initializer:
              equalinitializer:
                value:
                  literal:
                    value:
                      int: 1
        declarator:
          parameters:
          - parameterdeclaration:
              specifiers:
              - placeholdertypespecifier: {}
              declarator:
                iddeclarator:
                  name:
                    identifier:
                      spelling: 'y'
    - foldexpression:
        left:
          idexpression:
            name:
              identifier:
                spelling: record
        operator: '+'
    - requiresexpression:
        parameters:
        - parameterdeclaration:
            specifiers:
            - primitivetypespecifier:
                keyword: int
            declarator:
              iddeclarator:
                name:
                  identifier:
                    spelling: z
        requirements:
        - simplerequirement:
            expression:
              binaryexpression:
                left:
                  idexpression:
                    name:
                      identifier:
                        spelling: z
                operator: '+'
                right:
                  literal:
                    value:
                      int: 1
    - functionalcastexpression:
        type:
          primitivetypespecifier:
            keyword: int
        initializer:
          parenthesizedinitializer:
            arguments:
            - idexpression:
                name:
                  identifier:
                    spelling: record
    - postfixexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
        operator: '--'
    - namedcastexpression:
        operator: static_cast
        type:
          typeid:
            specifiers:
            - primitivetypespecifier:
                keyword: int
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - typeidexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - awaitexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - sizeofexpression:
        operand:
          typeid:
            specifiers:
            - primitivetypespecifier:
                keyword: int
    - sizeofpackexpression:
        pack:
          spelling: Ts
    - alignofexpression:
        keyword: alignof
        operand:
          typeid:
            specifiers:
            - primitivetypespecifier:
                keyword: int
    - noexceptexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - newexpression:
        type:
          typeid:
            specifiers:
            - primitivetypespecifier:
                keyword: int
        initializer:
          initializerlist:
            items:
            - literal:
                value:
                  int: 1
    - deleteexpression:
        array: true
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - assignmentexpression:
        left:
          idexpression:
            name:
              identifier:
                spelling: record
        operator: '='
        right:
          literal:
            value:
              int: 0
    - throwexpression: {}
    - yieldexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
    - packexpansion:
        pattern:
          idexpression:
            name:
              identifier:
                spelling: record
    - designatedinitializer:
        designators:
        - fielddesignator:
            name:
              spelling: x
        initializer:
          equalinitializer:
            value:
              idexpression:
                name:
                  identifier:
                    spelling: record
    - statementexpression: {}
    - extensionexpression:
        operand:
          idexpression:
            name:
              identifier:
                spelling: record
